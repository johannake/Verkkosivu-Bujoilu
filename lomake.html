<h2>Yhteydenottolomake</h2>
<p>Jos sinulla on kysyttävää, palautetta tai haluat muuten vain lähettää minulle terveisiä, voit tehdä sen tämän lomakkeen avulla.</p>

<form>
    <label for="nimi">Nimi:</label><br>
    <input type="text" id="name" maxlength="80" value="Maija Meikäläinen" style="width: 200px;"><br>
    <label for="email">Sähköposti:</label><br>
    <input type="email" id="email" maxlength="200" value="nimi@esimerkki.com" style="width: 200px;"><br>
    <br>
    <input type="radio" id="kysymys" name="aihe" value="kysymys">
   <label for="lehti">Kysymys</label><br>
   <input type="radio" id="palaute" name="aihe" value="palaute">
   <label for="kirja">Palaute</label><br>
   <input type="radio" id="terveiset" name="aihe" value="terveiset">
   <label for="terveiset">Muut terveiset</label><br> <br>
    <textarea rows="5"  id="palaute" style="width: 200px;"> Kirjoita viestisi tähän... </textarea><br>
    <br> 
   <input type="submit" value="Lähetä" style="width: 80px;">
   <input type="reset" value="Tyhjennä" style="width: 80px;">
    
</form>
